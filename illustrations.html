    <main class="gallery-content">
        <h1>ILLUSTRATIONS</h1>
<div class="gallery-grid">
    <img src="gallery-01.png" alt="作品1" onclick="openLightbox(this.src)">
    <img src="gallery-02.png" alt="作品2" onclick="openLightbox(this.src)">
    <img src="gallery-03.png" alt="作品3" onclick="openLightbox(this.src)">
</div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-button">&times;</span>
    <img id="lightbox-image" class="lightbox-image" src="" alt="拡大表示" onclick="event.stopPropagation()">
</div>
    </main>

<script>
    function openLightbox(imageSrc) {
        document.getElementById("lightbox").style.display = "flex";
        document.getElementById("lightbox-image").src = imageSrc;
    }

    function closeLightbox() {
        document.getElementById("lightbox").style.display = "none";
    }
    
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeLightbox();
    }
});

</script>
